{% extends "base.html" %}
{% block nav %}<nav><a href="/login">Connexion</a></nav>{% endblock %}
{% block content %}
<section class="card card-narrow">
  <h1>Créer un compte</h1>
  <form id="register-form" novalidate>
    <div class="field">
      <label for="name">Nom</label>
      <input id="name" name="name" type="text" autocomplete="name" required minlength="2" maxlength="100">
      <p class="field-error" id="error-name" role="alert"></p>
    </div>
    <div class="field">
      <label for="email">Adresse email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <p class="field-error" id="error-email" role="alert"></p>
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
      <p class="hint">8 caractères minimum, avec au moins une lettre et un chiffre.</p>
      <p class="field-error" id="error-password" role="alert"></p>
    </div>
    <p class="form-message" id="form-message" role="alert"></p>
    <button type="submit" class="button">Créer le compte</button>
  </form>
  <p class="alt-link">Déjà inscrit ? <a href="/login">Se connecter</a></p>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', path='js/auth-forms.js') }}"></script>{% endblock %}
